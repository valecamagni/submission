Common:
  mode: 3STEPS
  name: gensim_infp

  tasks:
    - m20
    - m30
    - m40
    - m50
    - m60
    - m70
    - m80
    - m90

  version: 142Xv0
  output_dir_base: /eos/cms/store/cmst3/group/l1tr/vcamagni/L1TauID/DATA/FPinputs
  ncpu: 4
  max_memory: 7000
  output_file_name: inputs140X.root

Configuration:
  - mode: FEVTDEBUG
    cmssw_config: ../step1.py
  - mode: FEVTDEBUGHLT
    cmssw_config: ../step2.py
  - mode: INFP
    cmssw_config: /afs/cern.ch/user/v/vcamagni/public/FastPuppi/CMSSW_14_2_0_pre2/src/FastPUPPI/NtupleProducer/python/runInputs140X.py


m20:
